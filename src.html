<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderno de Estudos</title>
<meta name="theme-color" content="#2D5BFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --sunk:#E9EDF6; --ink:#141B34; --muted:#5E6784; --line:#DCE1EE;
  --blue:#2D5BFF; --blue-deep:#1A3FD6; --blue-soft:#E2E9FF;
  --tang:#FF6A2B; --tang-soft:#FFE7DC;
  --violet:#7B5CF5; --violet-soft:#ECE6FF;
  --amber:#F2A007; --amber-soft:#FFF1D2;
  --mint:#12B07F; --mint-soft:#D8F4E9;
  --sky:#119FE3; --pink:#E9468A; --teal:#0E9E9B;
  --danger:#E0363B; --danger-soft:#FDE3E3;
  --f-ui:"Schibsted Grotesk", system-ui, sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, monospace;
  --r:14px; --r-sm:8px;
}
:root[data-tema="escuro"]{
  --bg:#0B1020; --surface:#131A2E; --sunk:#1B2339; --ink:#E8ECF7; --muted:#97A0BC; --line:#252F4A;
  --blue:#5C82FF; --blue-soft:#1C2A55; --tang:#FF7E45; --tang-soft:#3A2218;
  --violet:#9A82FF; --violet-soft:#2A2350; --amber:#FFB534; --amber-soft:#3A2D10;
  --mint:#2FCB97; --mint-soft:#103629; --danger:#FF5A5E; --danger-soft:#3D1A1D; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:90px;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 0 8px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--blue);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.sp{flex:1}
.ico{min-width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:17px;padding:0 6px}
.ico:active{background:var(--sunk)}
.sync{font-size:11px;color:var(--muted);padding:3px 8px;border-radius:99px;background:var(--sunk)}
.sync.err{background:var(--danger-soft);color:var(--danger)}
.tabs{display:flex;gap:4px;padding-bottom:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;border-radius:99px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;min-height:40px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab b{font-family:var(--f-num);font-size:11px;background:var(--tang);color:#fff;border-radius:99px;padding:1px 6px;margin-left:4px}
.quick{display:flex;gap:8px;padding:12px 0 4px}
.quick input{flex:1;min-width:0;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:15px;outline:none}
.quick input:focus{border-color:var(--blue)}
.quick button{height:46px;padding:0 16px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700}
.quick button:disabled{opacity:.4}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px;min-height:6px}
.pill{font-size:12.5px;padding:5px 10px;border-radius:99px;background:var(--blue-soft);color:var(--blue-deep);font-weight:600}
:root[data-tema="escuro"] .pill{color:var(--ink)}
.pill.q{background:var(--mint-soft);color:#08704f}.pill.e{background:var(--violet-soft);color:#4b2fc4}.pill.x{background:var(--tang-soft);color:#b8410c}.pill.bad{background:var(--danger-soft);color:var(--danger)}
:root[data-tema="escuro"] .pill.q,:root[data-tema="escuro"] .pill.e,:root[data-tema="escuro"] .pill.x{color:var(--ink)}
.hint{font-size:12px;color:var(--muted);padding-bottom:8px}
main{padding-top:14px}
.hero{border-radius:18px;padding:18px;background:linear-gradient(135deg,var(--blue) 0%,#5B3DF0 100%);color:#fff;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--tang);opacity:.9}
.hero>*{position:relative;z-index:1}
.hero .lbl{font-size:12px;opacity:.85;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.hero .big{font-size:44px;font-weight:800;line-height:1;margin:6px 0 2px}
.hero .big small{font-size:16px;font-weight:600;opacity:.9}
.hero .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hero .row div{background:rgba(255,255,255,.14);border-radius:12px;padding:9px 10px}
.hero .row b{display:block;font-family:var(--f-num);font-size:18px}
.hero .row span{font-size:11.5px;opacity:.9}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.panel-h{display:flex;align-items:center;gap:8px;padding:13px 14px 10px}
.panel-h h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel-h h3::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--hc,var(--blue))}
.panel-h .sub{font-size:12px;color:var(--muted)}
.act{margin-left:auto;font-size:13px;color:var(--blue);font-weight:600;padding:6px 8px;border-radius:8px;min-height:36px}
.pb{padding:0 14px 14px}
.item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);min-height:56px}
.item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.item .tx{flex:1;min-width:0}
.item .t1{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.clk{cursor:pointer}.item.clk:active{background:var(--sunk)}
.tag{font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.tag.late{background:var(--danger-soft);color:var(--danger)}.tag.due{background:var(--tang-soft);color:#c2470f}.tag.ok{background:var(--mint-soft);color:#08704f}.tag.new{background:var(--sunk);color:var(--muted)}.tag.cons{background:var(--violet-soft);color:#4b2fc4}
:root[data-tema="escuro"] .tag.due,:root[data-tema="escuro"] .tag.ok,:root[data-tema="escuro"] .tag.cons{color:var(--ink)}
.mini{min-width:40px;height:40px;border-radius:12px;background:var(--sunk);font-weight:700;font-size:13px;padding:0 10px;flex-shrink:0}
.mini.go{background:var(--blue);color:#fff}
.plan-row{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;padding:7px 0}
.plan-row .nm{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.plan-row .nm i{width:8px;height:8px;border-radius:3px}
.bar{height:8px;background:var(--sunk);border-radius:99px;position:relative;overflow:visible}
.bar>span{position:absolute;inset:0 auto 0 0;border-radius:99px}
.bar>em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35;border-radius:2px}
.stepper{display:flex;align-items:center;gap:2px;font-family:var(--f-num);font-size:13px}
.stepper button{width:30px;height:32px;border-radius:8px;background:var(--sunk);font-weight:700}
.stepper span{min-width:40px;text-align:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 13px;font-size:13.5px;font-weight:600;white-space:nowrap;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grp{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:12px 14px 6px;border-top:1px solid var(--line);background:var(--sunk)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:46px;border-radius:12px;font-weight:700;background:var(--sunk);font-size:14.5px}
.btn.solid{background:var(--blue);color:#fff}
.btn.tang{background:var(--tang);color:#fff}
.btn-line{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted);font-weight:600;font-size:14px}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}
.trophy{background:linear-gradient(135deg,var(--amber-soft),var(--tang-soft));border-color:transparent}
.trophy .g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.trophy .g div{background:var(--surface);border-radius:12px;padding:10px}
.trophy .g b{font-family:var(--f-num);font-size:20px;display:block}
.trophy .g span{font-size:12px;color:var(--muted)}
/* folha */
#layer{position:fixed;inset:0;z-index:50;display:none}
#layer.on{display:block}
#layer .back{position:absolute;inset:0;background:rgba(10,15,35,.42)}
#layer .sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px 28px;max-width:720px;margin:0 auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:18px;font-weight:800;line-height:1.25;padding-right:44px}
.sheet .x{position:absolute;right:10px;top:12px}
.sheet .meta{font-size:12.5px;color:var(--muted);margin:4px 0 14px}
.sheet .lab{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
.pct-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pct-grid button{min-height:44px;border-radius:10px;background:var(--sunk);font-family:var(--f-num);font-weight:700;font-size:13px}
.pct-grid button:active{background:var(--blue);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hist{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.hist .d{color:var(--muted);font-family:var(--f-num);font-size:12px;width:62px}
.hist .k{flex:1}
.hist button{width:36px;height:36px;border-radius:10px;color:var(--muted)}
textarea.note{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-size:14px;line-height:1.5;resize:vertical;outline:none}
textarea.note:focus{border-color:var(--blue)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field input{height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px;outline:none}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;z-index:80;font-size:14px;width:max-content;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast button{color:var(--tang);font-weight:800;padding:8px 10px;min-height:36px}
.banner{background:var(--tang-soft);border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.banner button{margin-left:auto;font-weight:700;color:#b8410c;white-space:nowrap}
:root[data-tema="escuro"] .banner button{color:var(--tang)}
.item .t1.full{white-space:normal;line-height:1.3;font-size:14px}
.cmp{font-size:12.5px;border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--sunk)}
.cmp.up{background:var(--mint-soft)}.cmp.down{background:var(--danger-soft)}
.nrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nbox{background:var(--sunk);border-radius:12px;padding:8px;text-align:center}
.nbox label{font-size:12px;color:var(--muted);font-weight:600}
.nbox div{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:4px}
.nbox button{width:40px;height:40px;border-radius:10px;background:var(--surface);font-size:18px;font-weight:700}
.nbox input{width:56px;height:40px;text-align:center;border:none;background:transparent;font-family:var(--f-num);font-size:22px;font-weight:700;outline:none}
.solid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.solid3 div{border-radius:12px;padding:10px;text-align:center}
.solid3 b{display:block;font-family:var(--f-num);font-size:22px}
.solid3 span{font-size:11.5px;color:var(--muted)}
.fase{display:inline-block;font-size:11px;font-weight:700;background:rgba(255,255,255,.2);border-radius:99px;padding:3px 9px;margin-bottom:6px}
.tab.cfg{margin-left:auto}
.sw{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px}
.sw input{width:22px;height:22px;accent-color:var(--blue)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="topbar">
    <div class="brand"><i>✎</i>Estudos</div>
    <div class="sp"></div>
    <span class="sync" id="sync">…</span>
    <button class="ico" id="btTema" aria-label="Tema">☀</button>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="quick">
    <input id="q" placeholder="estudei boto · koch 8/10 · errei crase" autocomplete="off" enterkeyhint="send">
    <button id="qGo" disabled>Lançar</button>
  </div>
  <div class="pills" id="pills"></div>
</div></header>
<main class="wrap" id="main"></main>
<div id="layer"><div class="back"></div><div class="sheet"></div></div>

<script>
const VERSAO = "02/11 16:30";
const FB_V = "12.19.0";
/* banco da temporada 2026 (o mesmo do site antigo). 2026 fica em usuarios/principal e só é LIDO. */
const FB_CFG = {apiKey:"AIzaSyBA3rElhXMxQpBqnLk9kQwYq1kUobDppUU",authDomain:"revisao-esfcex.firebaseapp.com",projectId:"revisao-esfcex",storageBucket:"revisao-esfcex.firebasestorage.app",messagingSenderId:"751976254334",appId:"1:751976254334:web:c2ce5b16ac7ba972e8c12f"};
const DOC_2026 = ["usuarios","principal"], DOC_2027 = ["usuarios","temporada2027"];
const LS = "estudos2027";

const RAW = /*TOPICOS*/;
const POR_QUESTOES = ["lp1","lp4","lp6","lp7"];
const CHAVES = {lp1:"napoleao",lp2:"antunes",lp3:"bakhtin",lp4:"bechara",lp5:"bncc",lp6:"manual",lp7:"aurelio",lp8:"koch",lp9:"marcuschi",lp10:"marquesi pauliukonis",lp11:"nilce estilistica",lp12:"neves",lp13:"dolz schneuwly",
  ped2:"valente",ped23:"roberto",ped24:"tomaz",ped20:"gestao democratica",ped21:"wildson",ped12:"la taille piaget vygotsky wallon",ped18:"rojo multiletramentos",ped25:"soares",ped29:"zabala",
  leg1:"cf constituicao",leg2:"eca",leg3:"ldb",leg4:"04/2010",leg5:"07/2010",leg6:"conselhos",leg7:"direitos humanos",leg8:"aee",leg9:"inclusiva",leg10:"bncc2017",leg11:"telas"};
const AREAS = {LP:{nome:"Português",cor:"var(--blue)"},PED:{nome:"Pedagogia",cor:"var(--violet)"},LEG:{nome:"Legislação",cor:"var(--pink)"},HIS:{nome:"História",cor:"var(--amber)"},GEO:{nome:"Geografia",cor:"var(--mint)"}};
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const TOP = RAW.map(([id,area,g,title])=>({id,area,g,title,modo:POR_QUESTOES.includes(id)?"q":"l",
  chaves:norm((CHAVES[id]||"")+" "+title.replace(/\(.*?\)/g," ")).split(/[^a-z0-9/]+/).filter(w=>w.length>=3)}));
const BYID = Object.fromEntries(TOP.map(t=>[t.id,t]));
const LEIT = TOP.filter(T=>T.modo==="l");
const rotulo = T => { const a=T.title.split(" — ")[0].replace(/\s*\(.*$/,""); return a.length>34?a.slice(0,32)+"…":a; };

/* ── datas ── */
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10);}
const hoje=()=>iso(new Date());
function addDias(n,b){const d=b?new Date(b+"T12:00"):new Date();d.setDate(d.getDate()+n);return iso(d);}
function dif(a,b){return Math.round((new Date(a+"T12:00")-new Date(b+"T12:00"))/864e5);}
const fmt=d=>d?d.slice(8,10)+"/"+d.slice(5,7):"—";

/* ── estado ── */
function novo(){return {ts:0,prova:"2027-08-01",fimLeitura:"2027-03-31",fase:1,revNaLeitura:false,top:{},notas:{},ass:{},h:null,notasImportadas:false};}
let S; try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}
S=Object.assign(novo(),S||{});
const R=id=>S.top[id]?.reg||[];
const reg=id=>(S.top[id]||(S.top[id]={reg:[]})).reg;
const estudado=id=>R(id).some(r=>r.t==="e");
function acerto(id){let q=0,a=0;R(id).forEach(r=>{if(r.t==="q"){q+=r.q;a+=r.a;}});return q?{q,a,p:Math.round(a/q*100)}:null;}
const h26=id=>S.h?.t?.[id];

/* ── revisão espaçada (vale na fase 2, ou na 1 se ligado em Ajustes) ── */
function agenda(id){
  let iv=0,prox=null;
  R(id).forEach(r=>{
    if(r.t==="e")iv=iv?Math.min(60,Math.round(iv*1.5)):7;
    else{const p=r.a/r.q;iv=p>=.85?Math.min(60,Math.round(Math.max(iv,3)*2.3)):p>=.7?Math.min(30,Math.round(Math.max(iv,3)*1.4)):2;}
    prox=addDias(iv,r.d);
  });
  return prox;
}
const revisando=()=>S.fase===2||S.revNaLeitura;
function situacao(id){
  const T=BYID[id];
  if(T.modo==="q")return {k:"cons",txt:"por questões",o:900};
  if(!estudado(id))return {k:"new",txt:"não lido",o:500};
  if(!revisando()){const a=acerto(id);return {k:"ok",txt:a?`${a.p}%`:"lido",o:600};}
  const d=dif(agenda(id),hoje());
  if(d<0)return {k:"late",txt:`atrasado ${-d}d`,o:d};
  if(d===0)return {k:"due",txt:"revisar hoje",o:0};
  return {k:"ok",txt:d===1?"amanhã":`em ${d}d`,o:100+d};
}

/* ── ordem da 1ª leitura: intercala matérias, puxa primeiro o que foi mais fraco em 2026 ── */
const PESO={PED:3,LEG:2,LP:2,HIS:1.5,GEO:1.2};
function fraqueza(id){const h=h26(id);if(!h)return 50;return (h.ac==null?60:100-h.ac)+(h.n<3?10:0);}
function fila(n){
  const feitos={},tot={};LEIT.forEach(T=>{tot[T.area]=(tot[T.area]||0)+1;feitos[T.area]=(feitos[T.area]||0)+(estudado(T.id)?1:0);});
  const rest=Object.fromEntries(Object.keys(AREAS).map(a=>[a,LEIT.filter(T=>T.area===a&&!estudado(T.id)).sort((x,y)=>fraqueza(y.id)-fraqueza(x.id))]));
  const out=[];
  while(out.length<n){
    let best=null,bv=1e9;
    for(const a in rest){if(!rest[a].length)continue;const v=feitos[a]/tot[a]/PESO[a];if(v<bv){bv=v;best=a;}}
    if(!best)break;out.push(rest[best].shift());feitos[best]++;
  }
  return out;
}

/* ── salvar: aparelho + nuvem, sem login ── */
let fb=null,syncT=null;
function setSync(t,err){const e=document.getElementById("sync");e.textContent=t;e.classList.toggle("err",!!err);}
function salvar(){S.ts=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}clearTimeout(syncT);setSync("salvando…");syncT=setTimeout(subir,700);}
const prazo=(p,ms=10000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error("prazo")),ms))]);
async function nuvem(){
  if(fb)return fb;
  const [A,F]=await Promise.all(["app","firestore"].map(m=>import(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-${m}.js`)));
  const app=A.initializeApp(FB_CFG,"estudos2027");fb={F,db:F.getFirestore(app)};return fb;
}
async function subir(){try{const f=await prazo(nuvem());await prazo(f.F.setDoc(f.F.doc(f.db,...DOC_2027),JSON.parse(JSON.stringify(S))));setSync("salvo");}catch(e){setSync("sem internet · salvo no aparelho",true);}}
async function baixar(){
  try{
    const f=await prazo(nuvem());
    const sn=await prazo(f.F.getDoc(f.F.doc(f.db,...DOC_2027)));
    if(sn.exists()&&(sn.data().ts||0)>(S.ts||0)){S=Object.assign(novo(),sn.data());try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
    else if(S.ts&&!sn.exists())subir();
    if(!S.h){const v=await prazo(f.F.getDoc(f.F.doc(f.db,...DOC_2026)));if(v.exists()){resumir2026(v.data());salvar();}}
    setSync("salvo");render();
  }catch(e){setSync("sem internet · salvo no aparelho",true);}
}
/* lê 2026 sem alterar nada lá: vira um resumo usado para ordem, comparação e anotações */
function isoV(d){if(!d)return null;return d.includes("/")?d.split("/").reverse().join("-"):d.slice(0,10);}
function resumir2026(D){
  const H={t:{},dias:[],vistosPorDia:[],qArea:{},revs:0};const prim={};const dias=new Set();
  Object.entries(D.state||{}).forEach(([id,s])=>{const E=s.entries||[];if(!E.length||!BYID[id])return;
    const qs=E.filter(e=>e.tipo==="questoes"&&e.acerto!=null).map(e=>+e.acerto);
    H.t[id]={n:E.length,ac:qs.length?Math.round(qs.reduce((a,b)=>a+b,0)/qs.length):null,acs:qs};
    H.revs+=E.length;H.qArea[BYID[id].area]=(H.qArea[BYID[id].area]||0)+qs.length;
    E.forEach(e=>{const d=isoV(e.date);if(d){dias.add(d);if(!prim[id]||d<prim[id])prim[id]=d;}});});
  H.dias=[...dias].sort();
  H.vistosPorDia=H.dias.map(d=>Object.values(prim).filter(p=>p<=d).length);
  S.h=H;
  if(!S.notasImportadas){Object.entries(D.notes||{}).forEach(([id,n])=>{if(n&&!S.notas[id])S.notas[id]=n;});S.notasImportadas=true;}
}

/* ── desfazer ── */
let toastT;
function toast(msg,desf,ms){document.querySelector(".toast")?.remove();clearTimeout(toastT);
  const el=document.createElement("div");el.className="toast";el.innerHTML=`<span>${msg}</span>`;
  if(desf){const b=document.createElement("button");b.textContent="Desfazer";b.onclick=()=>{desf();el.remove();};el.append(b);}
  document.body.append(el);toastT=setTimeout(()=>el.remove(),ms||(desf?7000:3500));}
function mudar(fn,msg){const antes=JSON.stringify(S);const extra=fn();salvar();render();
  if(msg!==null)toast(extra||msg||"Feito",()=>{S=JSON.parse(antes);salvar();render();});}

/* ── momentos 2026 ── */
function cmp2026(id,p){const h=h26(id);if(!h||h.ac==null)return "";const d=p-h.ac;
  return d>=5?` · ${d} pts acima de 2026 💪`:d<=-5?` · ${-d} pts abaixo de 2026 ⚠️`:" · mesmo nível de 2026";}
function marcoQuestoes(area){const h=S.h?.qArea?.[area];if(!h)return "";
  const n=LEIT.concat(TOP).filter((T,i,a)=>a.indexOf(T)===i&&T.area===area).reduce((s,T)=>s+R(T.id).filter(r=>r.t==="q").length,0);
  return n===h+1?` · já são mais blocos de questões de ${AREAS[area].nome} que em 2026 inteiro 🏅`:"";}
function diasEstudo(){const s=new Set();Object.values(S.top).forEach(t=>t.reg.forEach(r=>s.add(r.d)));return [...s].sort();}
function ritmo2026(){const H=S.h;if(!H)return "";const d=diasEstudo().length,n=H.dias.length;
  if(!d)return `Em 2026 foram ${n} dias de estudo. Esta temporada começa hoje.`;
  return d>n?`Já são ${d} dias de estudo — mais que os ${n} de 2026 inteiro 🏅`:`${d} dias de estudo nesta temporada · 2026 inteiro teve ${n}.`;}

/* ── lançar ── */
function registrar(id,r){const L=reg(id);L.push(Object.assign({d:hoje()},r));
  if(S.fase===1&&LEIT.every(T=>estudado(T.id))){S.fase=2;return "1ª leitura completa! 🎉 Começam as revisões.";}
  if(r.t==="q"){const p=Math.round(r.a/r.q*100);return `${rotulo(BYID[id])}: ${r.a}/${r.q} (${p}%)${cmp2026(id,p)}${marcoQuestoes(BYID[id].area)}`;}
  return `Estudado: ${rotulo(BYID[id])}`;}
function acharTopico(txt){
  const ws=norm(txt).split(/[^a-z0-9/]+/).filter(w=>w.length>=3&&!/^(estudei|revisei|questoes|questao|fiz|errei|acertei|li|reli|li)$/.test(w));
  if(!ws.length)return null;let best=null,bs=0;
  for(const T of TOP){let s=0;const ex=norm(CHAVES[T.id]||"").split(" ");
    for(const w of ws){if(ex.includes(w))s+=3;else if(T.chaves.includes(w))s+=2;else if(w.length>=4&&T.chaves.some(c=>c.startsWith(w)))s+=1;}
    if(s>bs){bs=s;best=T;}}
  return bs>=2?best:null;}
function interpretar(f){
  return f.split(/\s*[·;,]\s*/).map(s=>s.trim()).filter(Boolean).map(seg=>{const n=norm(seg);
    const m=n.match(/^(errei|erro)\s+(.+)$/);if(m)return {k:"x",ass:m[2].trim(),seg};
    const fr=n.match(/(\d+)\s*\/\s*(\d+)/);const T=acharTopico(n.replace(/\d+\s*\/\s*\d+/g," "));
    if(!T)return {k:"?",seg};
    if(fr&&+fr[2]>0)return {k:"q",T,a:Math.min(+fr[1],+fr[2]),q:+fr[2],seg};
    return {k:"e",T,seg};});}
const qIn=document.getElementById("q"),qGo=document.getElementById("qGo"),pills=document.getElementById("pills");
function previa(){const v=qIn.value.trim();if(!v){pills.innerHTML="";qGo.disabled=true;return;}
  const it=interpretar(v);qGo.disabled=!it.some(i=>i.k!=="?");
  pills.innerHTML=it.map(i=>i.k==="q"?`<span class="pill q">✏️ ${rotulo(i.T)} · ${i.a}/${i.q}</span>`:i.k==="e"?`<span class="pill e">📖 ${rotulo(i.T)}</span>`:i.k==="x"?`<span class="pill x">✕ errei ${i.ass}</span>`:`<span class="pill bad">? “${i.seg}”</span>`).join("");}
function lancar(){const it=interpretar(qIn.value.trim()).filter(i=>i.k!=="?");if(!it.length)return;
  mudar(()=>{let m;it.forEach(i=>{if(i.k==="x")m=errei(i.ass);else m=registrar(i.T.id,i.k==="q"?{t:"q",q:i.q,a:i.a}:{t:"e"});});return it.length>1?`${it.length} lançamentos`:m;});
  qIn.value="";previa();qIn.blur();}
function errei(ass){const k=norm(ass);const a=S.ass[k]||(S.ass[k]={erros:[],iv:0,prox:null});a.erros.push(hoje());a.iv=1;a.prox=addDias(1);return `Errou ${k}: volta amanhã`;}
qIn.addEventListener("input",previa);qIn.addEventListener("keydown",e=>{if(e.key==="Enter")lancar();});qGo.onclick=lancar;

/* ── telas ── */
let aba="hoje";
function render(){
  const y=scrollY;
  const pend=revisando()?LEIT.filter(T=>["late","due"].includes(situacao(T.id).k)).length:0;
  document.getElementById("tabs").innerHTML=[["hoje","Hoje"],...Object.entries(AREAS).map(([a,A])=>[a,A.nome]),["cfg","⚙"]]
    .map(([k,l])=>`<button class="tab${k==="cfg"?" cfg":""}" role="tab" aria-selected="${aba===k}" data-aba="${k}">${l}${k==="hoje"&&pend?`<b>${pend}</b>`:""}</button>`).join("");
  document.getElementById("main").innerHTML=aba==="hoje"?telaHoje():aba==="cfg"?telaCfg():telaArea(aba);
  scrollTo(0,y);
}
document.getElementById("tabs").onclick=e=>{const b=e.target.closest("[data-aba]");if(!b)return;aba=b.dataset.aba;render();scrollTo(0,0);b.scrollIntoView({inline:"center",block:"nearest"});};

function linha(T,acaoLi){
  const s=situacao(T.id),a=acerto(T.id),h=h26(T.id),u=R(T.id).at(-1);
  const sub=[u?`último ${fmt(u.d)}`:null,a?`${a.a}/${a.q} questões`:null,h?`2026: ${h.n}×${h.ac!=null?" · "+h.ac+"%":""}`:null].filter(Boolean).join(" · ");
  const dir=acaoLi&&!estudado(T.id)?`<button class="mini go" data-li="${T.id}" aria-label="Marcar como estudado">✓</button>`:`<span class="tag ${s.k}">${s.txt}</span>`;
  return `<div class="item clk" data-top="${T.id}"><span class="dot" style="background:${AREAS[T.area].cor}"></span><div class="tx"><div class="t1 full">${T.title}</div>${sub?`<div class="t2">${sub}</div>`:""}</div>${dir}</div>`;
}

function telaHoje(){
  const dias=Math.max(0,dif(S.prova,hoje()));
  const lidos=LEIT.filter(T=>estudado(T.id)).length,falta=LEIT.length-lidos;
  const sem=Math.max(1,dif(S.fimLeitura,hoje())/7);const porSem=Math.ceil(falta/sem);
  let h=`<div class="hero">
    <span class="fase">${S.fase===1?"Fase 1 · leitura de tudo":"Fase 2 · revisões"}</span>
    <div class="big num">${dias}<small> dias para a prova</small></div>
    <div style="font-size:13.5px;opacity:.92;margin-top:6px">${S.fase===1?`${lidos} de ${LEIT.length} lidos · ${falta?`${porSem} por semana até ${fmt(S.fimLeitura)}`:"leitura completa"}`:`${LEIT.filter(T=>situacao(T.id).k==="ok").length} tópicos em dia`}</div>
    ${S.h?`<div style="font-size:12.5px;opacity:.85;margin-top:8px">${ritmo2026()}</div>`:""}
  </div>`;

  if(S.fase===1){
    h+=`<div class="panel" style="--hc:var(--tang)"><div class="panel-h"><h3>A seguir</h3><span class="sub">toque ✓ quando terminar</span></div>`+fila(4).map(T=>linha(T,true)).join("")+`</div>`;
  }
  if(revisando()){
    const due=LEIT.map(T=>({T,s:situacao(T.id)})).filter(x=>["late","due"].includes(x.s.k)).sort((a,b)=>a.s.o-b.s.o);
    h+=`<div class="panel" style="--hc:var(--blue)"><div class="panel-h"><h3>Revisar hoje</h3><span class="sub num">${due.length}</span></div>`+
      (due.length?due.slice(0,6).map(x=>linha(x.T)).join("")+(due.length>6?`<div class="empty" style="padding:10px">+${due.length-6} depois desses</div>`:""):`<div class="empty">Tudo em dia.</div>`)+`</div>`;
  }
  const ass=Object.entries(S.ass).filter(([k,a])=>a.prox&&a.prox<=hoje());
  if(ass.length)h+=`<div class="panel" style="--hc:var(--tang)"><div class="panel-h"><h3>Gramática para rever</h3></div>`+ass.map(([k,a])=>linhaAss(k,a)).join("")+`</div>`;

  // solidez frente a 2026: só aparece quando já há base para comparar
  const cmp=LEIT.map(T=>{const a=acerto(T.id),hh=h26(T.id);return a&&hh&&hh.ac!=null?a.p-hh.ac:null;}).filter(x=>x!=null);
  if(cmp.length>=3){const up=cmp.filter(d=>d>=5).length,eq=cmp.filter(d=>d>-5&&d<5).length,dn=cmp.filter(d=>d<=-5).length;
    h+=`<div class="panel" style="--hc:var(--mint)"><div class="panel-h"><h3>Solidez frente a 2026</h3><span class="sub">${cmp.length} tópicos com questões</span></div><div class="pb"><div class="solid3">
    <div style="background:var(--mint-soft)"><b>${up}</b><span>mais sólidos</span></div><div style="background:var(--sunk)"><b>${eq}</b><span>iguais</span></div><div style="background:var(--danger-soft)"><b>${dn}</b><span>mais frágeis</span></div></div></div></div>`;}
  return h;
}
function linhaAss(k,a){const d=a.prox?dif(a.prox,hoje()):null;
  return `<div class="item"><span class="dot" style="background:var(--tang)"></span><div class="tx"><div class="t1">${k}</div><div class="t2">errou ${a.erros.length}× · ${d==null?"dominado":d<=0?"rever hoje":"volta em "+d+"d"}</div></div>
  <button class="mini" data-assok="${k}" aria-label="Revisei">✓</button><button class="mini" data-assdel="${k}" aria-label="Apagar">✕</button></div>`;}

function telaArea(a){
  const ts=TOP.filter(T=>T.area===a),l=ts.filter(T=>T.modo==="l"),lidos=l.filter(T=>estudado(T.id)).length;
  let h=`<div class="panel" style="--hc:${AREAS[a].cor}"><div class="panel-h"><h3>${AREAS[a].nome}</h3><span class="sub num" style="margin-left:auto">${lidos}/${l.length} lidos</span></div>
   <div class="pb"><div class="bar"><span style="width:${lidos/l.length*100}%;background:${AREAS[a].cor}"></span></div></div>`;
  const gs=[...new Set(l.map(T=>T.g))];
  gs.forEach(g=>{if(g)h+=`<div class="grp">${g}</div>`;h+=l.filter(T=>T.g===g).map(T=>linha(T,S.fase===1)).join("");});
  if(a==="LP"){
    const L=Object.entries(S.ass);
    h+=`<div class="grp">Gramática · estudo por questões</div>`+ts.filter(T=>T.modo==="q").map(T=>linha(T)).join("")+
      (L.length?L.map(([k,x])=>linhaAss(k,x)).join(""):`<div class="empty" style="padding:12px">Lance erros escrevendo “errei regência” na barra de cima.</div>`);
  }
  return h+`</div>`;
}

  const H=S.h;
  return `<div class="panel" style="--hc:var(--tang)"><div class="panel-h"><h3>Datas</h3></div><div class="pb">
    <div class="field"><label class="sub">Prova (ajuste quando sair o edital)</label><input type="date" data-cfg="prova" value="${S.prova}"></div>
    <div class="field"><label class="sub">Terminar a 1ª leitura até</label><input type="date" data-cfg="fimLeitura" value="${S.fimLeitura}"></div></div></div>

    <div><b>${H.revs}</b><span>revisões</span></div><div><b>${H.dias.length}</b><span>dias de estudo</span></div>
    <div><b>${Object.values(H.qArea).reduce((a,b)=>a+b,0)}</b><span>blocos de questões</span></div><div><b>${Object.keys(H.t).length}</b><span>tópicos vistos</span></div></div>
    <a class="btn-line" style="margin-top:10px" href="2026.html">Abrir o site de 2026</a></div></div>`:""}
  <div class="panel" style="--hc:var(--mint)"><div class="panel-h"><h3>Mais</h3></div><div class="pb" style="display:grid;gap:8px">
    <button class="btn" data-acao="backup">Baixar cópia de segurança</button>
    <button class="btn" data-acao="instalar">Instalar como app</button>
    <div class="sub" style="text-align:center">Salva sozinho no aparelho e na nuvem · versão ${VERSAO}</div></div></div>`;

/* ── folha do tópico ── */
function abrirFolha(html){const L=document.getElementById("layer");L.querySelector(".sheet").innerHTML=`<div class="grab"></div><button class="ico x" data-fechar>✕</button>`+html;L.classList.add("on");}
function fecharFolha(){document.getElementById("layer").classList.remove("on");}
document.querySelector("#layer .back").onclick=fecharFolha;
let nq=10,na=8;
function folha(id){
  const T=BYID[id],h=h26(id),a=acerto(id),L=R(id).slice().reverse();
  abrirFolha(`<h2>${T.title}</h2><div class="meta">${AREAS[T.area].nome}${T.g?" · "+T.g:""}</div>
  ${h?`<div class="cmp">2026: ${h.n} revisões${h.ac!=null?` · média ${h.ac}%`:""}${a&&h.ac!=null?` · agora ${a.p}%`:""}</div>`:""}
  ${T.modo==="l"?`<button class="btn tang" data-li="${id}">📖 ${estudado(id)?"Estudei de novo":"Estudei"}</button>`:`<div class="cmp">Obra de consulta: estude por questões e lance os erros por assunto.</div>`}
  <div class="lab">Questões</div>
  <div class="nrow">
    <div class="nbox"><label>Fiz</label><div><button data-n="q" data-d="-1">−</button><input id="nq" type="number" inputmode="numeric" value="${nq}"><button data-n="q" data-d="1">+</button></div></div>
    <div class="nbox"><label>Acertei</label><div><button data-n="a" data-d="-1">−</button><input id="na" type="number" inputmode="numeric" value="${na}"><button data-n="a" data-d="1">+</button></div></div>
  </div>
  <button class="btn solid" style="margin-top:8px" data-salvarq="${id}">Salvar questões</button>
  <div class="lab">Anotações</div>
  <textarea class="note" data-nota="${id}" placeholder="Distinções, pegadinhas…">${esc(S.notas[id]||"")}</textarea>
  ${L.length?`<div class="lab">Histórico 2027</div>`+L.map((r,i)=>`<div class="hist"><span class="d">${fmt(r.d)}</span><span class="k">${r.t==="q"?`✏️ ${r.a}/${r.q}`:"📖 estudo"}</span><button data-del="${id}" data-i="${L.length-1-i}" aria-label="Apagar">✕</button></div>`).join(""):""}`);
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);

/* ── cliques ── */
document.addEventListener("click",e=>{
  const g=k=>e.target.closest(`[data-${k}]`);let b;
  if(g("fechar"))return fecharFolha();
  if(b=g("li")){e.stopPropagation();const id=b.dataset.li;const aberta=document.getElementById("layer").classList.contains("on");mudar(()=>registrar(id,{t:"e"}));if(aberta)fecharFolha();return;}
  if(b=g("n")){const k=b.dataset.n;const el=document.getElementById("n"+k);let v=Math.max(0,(+el.value||0)+ +b.dataset.d);
    if(k==="a")v=Math.min(v,+document.getElementById("nq").value||0);el.value=v;if(k==="q"&&+document.getElementById("na").value>v)document.getElementById("na").value=v;return;}
  if(b=g("salvarq")){const q=+document.getElementById("nq").value||0,a=Math.min(+document.getElementById("na").value||0,q);
    if(!q)return toast("Coloque quantas questões fez.");nq=q;na=a;const id=b.dataset.salvarq;mudar(()=>registrar(id,{t:"q",q,a}));fecharFolha();return;}
  if(b=g("del")){const id=b.dataset.del;mudar(()=>{S.top[id].reg.splice(+b.dataset.i,1);},"Apagado");folha(id);return;}
  if(b=g("top"))return folha(b.dataset.top);
  if(b=g("assok")){const k=b.dataset.assok,nx={1:3,3:7,7:15};return mudar(()=>{const a=S.ass[k];a.iv=nx[a.iv]||null;a.prox=a.iv?addDias(a.iv):null;return a.iv?`${k}: volta em ${a.iv} dias`:`${k}: dominado ✓`;});}
  if(b=g("assdel"))return mudar(()=>{delete S.ass[b.dataset.assdel];},"Apagado");
  if(b=g("acao")){const a=b.dataset.acao;
    if(a==="fase")return mudar(()=>{S.fase=S.fase===1?2:1;return S.fase===2?"Fase de revisões ligada":"De volta à 1ª leitura";});
    if(a==="backup"){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));const l=document.createElement("a");l.href=u;l.download=`estudos-${hoje()}.json`;l.click();URL.revokeObjectURL(u);return;}
    if(a==="instalar")return instalar();}
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.nota!==undefined){S.notas[t.dataset.nota]=t.value;if(!t.value)delete S.notas[t.dataset.nota];salvar();}
  if(t.id==="nq"||t.id==="na"){/* digitação livre */}
  if(t.dataset.cfg&&t.type==="date"&&t.value){S[t.dataset.cfg]=t.value;salvar();}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.cfg==="revNaLeitura"){S.revNaLeitura=t.checked;salvar();render();}});

/* ── tema, instalação, versão ── */
const TEMAS=["claro","escuro","auto"];
const temaAtual=()=>{try{return localStorage.getItem("estudos_tema")||"claro"}catch(e){return "claro"}};
function aplicarTema(){const t=temaAtual();document.documentElement.dataset.tema=t==="auto"?(matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro"):t;document.getElementById("btTema").textContent=t==="claro"?"☀":t==="escuro"?"☾":"◐";}
document.getElementById("btTema").onclick=()=>{const t=TEMAS[(TEMAS.indexOf(temaAtual())+1)%3];try{localStorage.setItem("estudos_tema",t)}catch(e){}aplicarTema();toast(`Tema ${t==="auto"?"automático":t}`);};
aplicarTema();
let pedido=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();pedido=e;});
function instalar(){if(pedido){pedido.prompt();pedido=null;return;}
  abrirFolha(`<h2>Instalar como app</h2><div class="lab">Android (Chrome)</div><div>Menu ⋮ → <b>Adicionar à tela inicial</b>.</div><div class="lab">iPhone (Safari)</div><div>Compartilhar ⬆ → <b>Adicionar à Tela de Início</b>.</div>`);}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
async function procurarVersao(){try{const v=(await (await fetch("version.json",{cache:"no-store"})).json()).versao;
  if(v&&v!==VERSAO){const k="estudos_v_"+v;try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,1);}catch(e){}
    if(document.getElementById("layer").classList.contains("on")||document.activeElement===qIn){toast("Versão nova",()=>location.reload(),15000);document.querySelector(".toast button").textContent="Atualizar";}else location.reload();}}catch(e){}}
addEventListener("pagehide",()=>{clearTimeout(syncT);if(S.ts)subir();});
document.addEventListener("visibilitychange",()=>{if(document.hidden){clearTimeout(syncT);if(S.ts)subir();}else{procurarVersao();baixar();}});
render();baixar();procurarVersao();
</script>
